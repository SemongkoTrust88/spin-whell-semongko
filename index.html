<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070707">
  <title>BIGSLOTO Lucky Wheel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <!-- Winwheel 2.8.0 + GSAP 2: dependency used by the original project. -->
  <script src="https://cdn.jsdelivr.net/gh/zarocknz/javascript-winwheel@2.8.0/Winwheel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.0.2/TweenMax.min.js"></script>
</head>
<body>
  <div id="confetti-layer" aria-hidden="true"></div>

  <div id="welcome-wrapper">
    <div id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Selamat Datang di Lucky Wheel!</h1>
      <p>
        Silakan masukkan kode tiket yang diberikan, kemudian tekan tombol SPIN untuk memulai.
      </p>
      <button id="agree" type="button">Oke, Terima Kasih!</button>
    </div>
  </div>

  <main id="wrapper">
    <section class="wheel-card">
      <div class="wheel-stage">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="canvas" width="434" height="434">
          Browser Anda tidak mendukung HTML5 Canvas.
        </canvas>
      </div>

      <div class="controls">
        <h2>Masukkan Kode Tiket</h2>
        <div class="input-row">
          <input id="code" type="text" inputmode="text" autocomplete="off" placeholder="Masukkan Kode" aria-label="Kode tiket">
          <button id="spin_button" type="button">SPIN</button>
        </div>
        <p class="status" id="status" role="status">Siap.</p>
      </div>
    </section>
  </main>

  <div id="alert" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="alert-text">
    <div class="modal-card">
      <button class="close" id="close-alert" type="button" aria-label="Tutup">&times;</button>
      <div id="alert-text"></div>
    </div>
  </div>

  <div id="congrats" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="congrats-text">
    <div class="modal-card win-card">
      <button class="close" id="close-congrats" type="button" aria-label="Tutup">&times;</button>
      <div id="congrats-text"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
